apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    compileSdk 35

    defaultConfig {
        applicationId "tn.amin.mpro2"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 28
        versionName "1.2.7"


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def suffix = variant.buildType.name == "release"
                    ? "release-unsigned"
                    : variant.buildType.name
            output.outputFileName = "mPro-v${variant.versionName}-${suffix}.apk"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    namespace 'tn.amin.mpro2'
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}


dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.navigation:navigation-fragment:2.8.5'
    implementation 'androidx.navigation:navigation-ui:2.8.5'
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.joaomgcd:taskerpluginlibrary:0.4.4'

    implementation "org.greenrobot:eventbus:3.3.1"
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.github.lanahajyahia:SettingLibrary:1.00.01'
    implementation 'com.mojang:brigadier:1.0.18'
    implementation 'org.apache.commons:commons-text:1.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'commons-io:commons-io:2.18.0'

    implementation 'io.github.neonorbit:dexplore:1.4.5'
    compileOnly 'de.robv.android.xposed:api:82'
//    compileOnly 'de.robv.android.xposed:api:82:sources'
}
