name: Android APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Resolve APK paths
        id: apks
        shell: bash
        run: |
          DEBUG_APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -name 'mPro-v*-debug.apk' | head -n 1)"
          RELEASE_APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -name 'mPro-v*-release-unsigned.apk' | head -n 1)"
          if [ -z "$DEBUG_APK_PATH" ] || [ ! -f "$DEBUG_APK_PATH" ]; then
            echo "Debug APK not found in app/build/outputs/apk/debug"
            exit 1
          fi
          if [ -z "$RELEASE_APK_PATH" ] || [ ! -f "$RELEASE_APK_PATH" ]; then
            echo "Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi
          echo "debug_path=$DEBUG_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "debug_name=$(basename "$DEBUG_APK_PATH" .apk)" >> "$GITHUB_OUTPUT"
          echo "release_path=$RELEASE_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "release_name=$(basename "$RELEASE_APK_PATH" .apk)" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apks.outputs.debug_name }}-apk
          path: ${{ steps.apks.outputs.debug_path }}

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apks.outputs.release_name }}-apk
          path: ${{ steps.apks.outputs.release_path }}

      - name: Create GitHub Release and upload APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apks.outputs.debug_path }}
            ${{ steps.apks.outputs.release_path }}
          generate_release_notes: true
