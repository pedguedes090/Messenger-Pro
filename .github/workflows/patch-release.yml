name: Patch & Release (Messenger + Facebook)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  MESSENGER_URL: https://huggingface.co/buckets/meetea/data/resolve/original/com.facebook.orca_576.0.0.47.92-345212652_minAPI28%28arm64-v8a%29%28nodpi%29_apkmirror.com.apk
  FACEBOOK_URL: https://huggingface.co/buckets/meetea/data/resolve/original/com.facebook.katana_576.0.0.42.73-474227017_1dpi_ff384da02235462f96b29bfdb2c3f247_apkmirror.com.apkm
  FB_DEX_URL: https://huggingface.co/buckets/meetea/data/resolve/original/facebook-576-18dex.zip
  MRVPATCHER_URL: https://github.com/NeonOrbit/MRVPatcher/releases/download/5.8.1/MRVPatcher-5.8.1.jar
  CHATHEAD_URL: https://github.com/NeonOrbit/ChatHeadEnabler/releases/download/v2.4.7/ChatHeadEnabler-v2.4.7.apk

jobs:
  patch-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # --- 1. build module ---
      - name: Build module APK
        run: ./gradlew assembleDebug

      # --- 2. download inputs ---
      - name: Download inputs
        run: |
          mkdir -p in out out-debug
          curl -fsSL --retry 3 -o in/Messenger.apk "$MESSENGER_URL"
          curl -fsSL --retry 3 -o in/Facebook.apkm "$FACEBOOK_URL"
          curl -fsSL --retry 3 -o in/fb-dex.zip "$FB_DEX_URL"
          curl -fsSL --retry 3 -o in/MRVPatcher.jar "$MRVPATCHER_URL"
          curl -fsSL --retry 3 -o in/ChatHeadEnabler-v2.4.7.apk "$CHATHEAD_URL"
          mkdir -p in/fb-dex
          unzip -o -q in/fb-dex.zip -d in/fb-dex/

      # --- 3. patch Messenger (MRV) ---
      - name: Patch Messenger
        run: |
          java -jar in/MRVPatcher.jar in/Messenger.apk -o out -f --modules tn.amin.mpro2
          mv out/Messenger-mrv.apk out/Messenger-v576.0.0.47.92.apk

      # --- 4a. Facebook MRV-signed ---
      - name: Patch Facebook (MRV)
        run: |
          export FB_APKM="$PWD/in/Facebook.apkm"
          export FB_DEXDIR="$PWD/in/fb-dex"
          export MRV_JAR="$PWD/in/MRVPatcher.jar"
          export OUT_DIR="$PWD/out"
          export WORK="$PWD/work-fb"
          bash pipeline/fb/run.sh
          mv out/final_unsigned-mrv.apk out/Facebook-v576.0.0.42.73.apk

      # --- 4b. Facebook debug-signed (no MRV) ---
      - name: Patch Facebook (debug, no MRV)
        run: |
          export FB_APKM="$PWD/in/Facebook.apkm"
          export FB_DEXDIR="$PWD/in/fb-dex"
          unset MRV_JAR
          export OUT_DIR="$PWD/out-debug"
          export WORK="$PWD/work-fb-debug"
          mkdir -p "$OUT_DIR" "$WORK"
          bash pipeline/fb/run.sh
          mv "$OUT_DIR/Facebook-576-patched.apk" "$OUT_DIR/Facebook-576-local-debug.apk"

      # --- 5. upload artifacts ---
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patched-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            out/Messenger-v576*.apk
            out/Facebook-v576*.apk
            out-debug/Facebook-576-local-debug.apk
            in/ChatHeadEnabler-v2.4.7.apk

      # --- 6. create release on tag ---
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/mPro-v*-debug.apk
            out/Messenger-v576*.apk
            out/Facebook-v576*.apk
            out-debug/Facebook-576-local-debug.apk
            in/ChatHeadEnabler-v2.4.7.apk
          generate_release_notes: true
