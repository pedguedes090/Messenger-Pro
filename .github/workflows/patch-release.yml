name: Patch & Release (Messenger 583 + Facebook 582)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  MESSENGER_URL: https://huggingface.co/buckets/meetea/data/resolve/original/messenger-orca-583.0.0.29.95-346611418.apk
  FACEBOOK_URL: https://huggingface.co/buckets/meetea/data/resolve/original/facebook-katana-582.0.0.50.54-475417168.apk
  MRVPATCHER_URL: https://github.com/NeonOrbit/MRVPatcher/releases/download/5.8.1/MRVPatcher-5.8.1.jar
  CHATHEAD_URL: https://github.com/NeonOrbit/ChatHeadEnabler/releases/download/v2.4.7/ChatHeadEnabler-v2.4.7.apk

jobs:
  patch-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # --- 1. build module ---
      - name: Build module APK
        run: ./gradlew clean testDebugUnitTest lintDebug assembleDebug

      # --- 2. download inputs ---
      - name: Download inputs
        run: |
          mkdir -p in out
          curl -fsSL --retry 3 -o in/Messenger.apk "$MESSENGER_URL"
          curl -fsSL --retry 3 -o in/Facebook.apk "$FACEBOOK_URL"
          curl -fsSL --retry 3 -o in/MRVPatcher.jar "$MRVPATCHER_URL"
          curl -fsSL --retry 3 -o in/ChatHeadEnabler-v2.4.7.apk "$CHATHEAD_URL"

      # --- 3. patch Messenger 583 (MRV) ---
      - name: Patch Messenger
        run: |
          mkdir -p out/messenger-mrv
          java -jar in/MRVPatcher.jar in/Messenger.apk -o out/messenger-mrv -f --modules tn.amin.mpro2
          mv out/messenger-mrv/Messenger-mrv.apk out/Messenger-v583.0.0.29.95.apk

      # --- 4. patch Facebook 582 DEX and build an installable APK ---
      - name: Patch Facebook 582
        run: |
          bash pipeline/fb/build_582_apk.sh in/Facebook.apk out/Facebook-582-clean.apk

      # --- 5. MRV-sign the patched Facebook APK ---
      - name: MRV patch Facebook 582
        run: |
          mkdir -p out/facebook-mrv
          java -jar in/MRVPatcher.jar out/Facebook-582-clean.apk -p -o out/facebook-mrv -f
          mv out/facebook-mrv/Facebook-582-clean-mrv.apk out/Facebook-v582.0.0.50.54.apk

      # --- 6. upload artifacts ---
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patched-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            out/Messenger-v583*.apk
            out/Facebook-v582*.apk
            out/Facebook-582-clean.apk
            in/ChatHeadEnabler-v2.4.7.apk

      # --- 7. create release on tag ---
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/mPro-v*-debug.apk
            out/Messenger-v583*.apk
            out/Facebook-v582*.apk
            out/Facebook-582-clean.apk
            in/ChatHeadEnabler-v2.4.7.apk
          generate_release_notes: true
